[project]
name = "ave"
version = "0.1.0"
description = "A.V.E. (Avelin Video Edit) — conversation-driven video editor skill for Claude Code"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pillow",
    "numpy",
    # Face/eye tracking for the Phase-2 dynamic camera (face_track.py). Pinned:
    # opencv-python-headless 5.0.0.93 ships without CascadeClassifier and breaks
    # Haar detection — stay on the 4.10 line. Headless = no GUI/Qt deps.
    "opencv-python-headless==4.10.0.84",
    "fonttools[woff]>=4.50",
]

[project.optional-dependencies]
animations = ["manim"]
# Person matting for the "element behind the subject" effect (person_matte.py).
# Robust Video Matting via torch.hub — heavy (~2GB), so it's opt-in: install with
# `uv sync --extra matting`. Base install stays light for users who don't need it.
matting = ["torch", "torchvision"]
# "Animação em 3D" (aba Estilo): rastreio de mãos/rosto/corpo (MediaPipe) e mapa
# de profundidade (Depth Anything V2 via transformers). Opt-in e pesado — o
# `helpers/instalar_anim3d.py` instala sozinho na primeira vez que o usuário
# escolhe o formato, com `--inexact` para não desinstalar os outros extras.
# O mediapipe puxa opencv-contrib-python 5.x, que sobrescreve o cv2 do pin
# acima — conferido (2026-10-12): a versão contrib TEM o CascadeClassifier e o
# face_track.py segue achando o rosto (117/122 quadros num teste de 4s).
anim3d = ["mediapipe>=0.10.14", "transformers>=4.45", "torch", "torchvision"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
