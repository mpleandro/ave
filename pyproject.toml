[project]
name = "ave"
version = "0.1.0"
description = "A.V.E. (Avelin Video Edit) — conversation-driven video editor skill for Claude Code"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pillow",
    "numpy",
    # Face/eye tracking for the Phase-2 dynamic camera (face_track.py). Pinned:
    # opencv-python-headless 5.0.0.93 ships without CascadeClassifier and breaks
    # Haar detection — stay on the 4.10 line. Headless = no GUI/Qt deps.
    "opencv-python-headless==4.10.0.84",
    "fonttools[woff]>=4.50",
    # Transcrição LOCAL (transcribe_local.py): Silero VAD acha as regiões de fala
    # e o Whisper transcreve cada região isolada — é o que faz retake e gaguejo
    # sobreviverem no texto. Sem chave de API. onnxruntime roda o VAD na CPU.
    # ffmpeg COMPLETO (zscale/deesser/loudnorm) sem brew: helpers/ffbin.py e o
    # install.sh usam esta build quando o ffmpeg do sistema falta ou é enxuto.
    "static-ffmpeg>=2.7",
    "huggingface_hub>=0.23",
    "silero-vad>=5.1",
    # onnxruntime também roda o RECORTE (matte_engine.py). No Windows, a build
    # DirectML: o mesmo pacote + aceleração em qualquer placa DX12 (NVIDIA,
    # AMD, Intel), com a CPU de reserva — o VAD segue igual.
    # (DirectML só tem build x64; Windows ARM fica no onnxruntime comum. Escrito
    # como exceção ao ARM64 porque o x64 se chama AMD64 no Python e x86_64 no uv.)
    "onnxruntime>=1.17; sys_platform != 'win32' or platform_machine == 'ARM64'",
    "onnxruntime-directml>=1.17; sys_platform == 'win32' and platform_machine != 'ARM64'",
    "soundfile>=0.12",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
animations = ["manim"]
# Person matting for the "element behind the subject" effect (person_matte.py).
# Robust Video Matting via torch.hub — heavy (~2GB), so it's opt-in: install with
# `uv sync --extra matting`. Base install stays light for users who don't need it.
# O recorte em si roda no onnxruntime da BASE (helpers/matte_engine.py); este
# extra é o TURBO do Mac: torch converte o RVM para CoreML uma vez por resolução
# e o coremltools roda o modelo no Neural Engine. No M3, medido: torch MPS
# 22 fps > CoreML 15 > onnx CPU 11 — o `matte_engine.py bench` decide por máquina.
matting = ["torch", "torchvision", "coremltools>=8; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# "Animação em 3D" (aba Estilo): rastreio de mãos/rosto/corpo (MediaPipe) e mapa
# de profundidade (Depth Anything V2 via transformers). Opt-in e pesado — o
# `helpers/instalar_anim3d.py` instala sozinho na primeira vez que o usuário
# escolhe o formato, com `--inexact` para não desinstalar os outros extras.
# O mediapipe puxa opencv-contrib-python 5.x, que sobrescreve o cv2 do pin
# acima — conferido (2026-10-12): a versão contrib TEM o CascadeClassifier e o
# face_track.py segue achando o rosto (117/122 quadros num teste de 4s).
anim3d = ["mediapipe>=0.10.14", "transformers>=4.45", "torch", "torchvision"]
# Escuta local do corte (verify_takes.py, dentro do portão da Fase 1): mlx-whisper
# roda na máquina, grátis e offline — mas só em Apple Silicon. Antes deste extra
# ele era instalado à mão e um `uv sync` comum o apagava sem aviso.
escuta = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Baixar de link (ingest_url.py): yt-dlp dentro do ambiente, sem pedir brew.
link = ["yt-dlp"]
# Enquadramento vertical do garimpo de cortes (helpers/cortes/enquadramento.py):
# os pontos do rosto (abertura do maxilar, sorriso) vêm do MediaPipe. Os modelos
# (rosto, pontos do rosto, impressão de voz) não são pacote — o instalar.py
# baixa para ~/.avelin/modelos. Mesmo opencv-contrib 5.x do anim3d (ver acima).
enquadramento = ["mediapipe>=0.10.14"]
# Todos os recursos acima são instalados SOB DEMANDA por helpers/instalar.py, na
# primeira vez em que o usuário pede o efeito — ninguém precisa citá-los aqui.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
# O faster-whisper depende do `onnxruntime` COMUM. No Windows ele chegaria junto
# com o `onnxruntime-directml` — os dois instalam a MESMA pasta `onnxruntime`, o
# último sobrescreve o outro e o DirectML some (ou o import quebra pela metade).
# Este override tira o comum do Windows: lá o directml fornece o módulo para o
# VAD do faster-whisper e para o recorte. O instalar.py repara venvs antigos.
override-dependencies = ["onnxruntime>=1.17; sys_platform != 'win32' or platform_machine == 'ARM64'"]
# O directml 1.24+ não publica wheel para o Python 3.10: sem este teto o lock
# escolhe 1.24.3 ali e a instalação base quebra no Windows com Python 3.10.
constraint-dependencies = ["onnxruntime-directml<1.24; python_full_version < '3.11'"]
