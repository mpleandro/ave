<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* CTA "Siga o perfil" — modelo da biblioteca (assets/cta/, helpers/cta.py).
   * Nasceu sob medida no "Mais viral, mais raso" (2026-10-13): cápsula escura
   * no topo que abre a partir da foto, "Siga o perfil" + @, botão "Seguir"; um
   * cursor aperta e o botão vira "Seguindo ✓". Foto, @ e cor do botão são
   * variáveis — o anel segue a cor de destaque do projeto. O clique ({{CLIQUE}}s
   * dentro do modelo) é alinhado pelo composer com o último "segue/siga" da fala.
   */
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: local('Montserrat ExtraBold'), local('Montserrat-ExtraBold'); }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: local('Montserrat Bold'), local('Montserrat-Bold'); }
  @font-face { font-family: 'Montserrat'; font-weight: 500; src: local('Montserrat Medium'), local('Montserrat-Medium'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  /* o palco leva pílula e cursor juntos: a ESCALA vive nele (o GSAP já anima
     o transform da pílula) e o cursor continua mirando o botão no mesmo espaço */
  #{{ID}}-palco { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #{{ID}}-pilula { position: absolute; top: 150px; left: 190px; width: 700px; height: 120px; border-radius: 60px; overflow: hidden;
    background: rgba(24,24,24,.94); border: 1.5px solid rgba(255,255,255,.08);
    box-shadow: 0 18px 50px rgba(0,0,0,.45); opacity: 0; font-family: 'Montserrat', sans-serif; }
  #{{ID}}-anel { position: absolute; left: 12px; top: 12px; width: 96px; height: 96px; border-radius: 50%;
    background: conic-gradient(from 200deg, {{ACCENT}}, #FFAB51, {{ACCENT}}); padding: 4px; }
  #{{ID}}-anel img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #181818; display: block; }
  #{{ID}}-textos { position: absolute; left: 128px; top: 22px; white-space: nowrap; opacity: 0; }
  #{{ID}}-titulo { font-weight: 800; font-size: 36px; color: #fff; letter-spacing: -.5px; line-height: 1.15; }
  #{{ID}}-arroba { font-weight: 500; font-size: 24px; color: #b8b2ad; margin-top: 4px; }
  #{{ID}}-botao { position: absolute; right: 16px; top: 26px; width: 196px; height: 68px; border-radius: 34px;
    display: grid; place-items: center; background: {{ACCENT}}; color: #fff; font-weight: 700; font-size: 27px;
    opacity: 0; }
  #{{ID}}-botao .a, #{{ID}}-botao .b { grid-area: 1 / 1; }
  #{{ID}}-botao .b { opacity: 0; color: #e8e4e0; }
  #{{ID}}-cursor { position: absolute; left: 0; top: 0; width: 58px; height: 58px; opacity: 0;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
</style>
</head>
<body>
<div id="root" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURACAO}}"
     data-width="1080" data-height="1920">
  <div id="{{ID}}-palco">
  <div id="{{ID}}-pilula">
    <div id="{{ID}}-anel"><img src="{{FOTO}}" alt="" /></div>
    <div id="{{ID}}-textos"><div id="{{ID}}-titulo">Siga o perfil</div><div id="{{ID}}-arroba">@{{ARROBA}}</div></div>
    <div id="{{ID}}-botao"><span class="a">Seguir</span><span class="b">Seguindo ✓</span></div>
  </div>
  <svg id="{{ID}}-cursor" viewBox="0 0 24 24"><path d="M4 2.5l15 9.2-6.6 1.3 3.9 7.3-2.6 1.4-3.9-7.3L5 19z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div>
<script>
  var tl = gsap.timeline({ paused: true });
  /* POSIÇÃO E TAMANHO (cta.top/left/width, em % do quadro, gravados pelo
     cta.py): TOPO é a borda de cima VISÍVEL da pílula — a escala nasce dela,
     então encolher não a tira do lugar. Placeholder não substituído (a
     demonstração do editor) cai no padrão de sempre: topo, 700px, centrada. */
  var num = function (v, d) { v = parseFloat(v); return isFinite(v) ? v : d; };
  var TOPO = num('{{PTOP}}', 150), ESC = num('{{PESC}}', 1), CX = num('{{PCX}}', 540);
  if (ESC <= 0) ESC = 1;
  var LARG = 700, ESQ = CX - LARG / 2;
  var pil = document.getElementById('{{ID}}-pilula'), palco = document.getElementById('{{ID}}-palco');
  pil.style.top = TOPO + 'px'; pil.style.left = ESQ + 'px';
  palco.style.transformOrigin = CX + 'px ' + TOPO + 'px';
  palco.style.transform = 'scale(' + ESC + ')';
  /* 1. nasce a bolinha com a foto */
  /* a cápsula já está no lugar final; um recorte mostra só a foto e um
     deslocamento a centraliza — abrir é desfazer os dois (transform + clip,
     nada de layout, que treme no render quadro a quadro) */
  var FECHA = LARG - 120;
  tl.fromTo('#{{ID}}-pilula', { opacity: 0, scale: .4, y: -20, x: FECHA / 2, clipPath: 'inset(0px ' + FECHA + 'px 0px 0px round 60px)' },
            { opacity: 1, scale: 1, y: 0, duration: .35, ease: 'back.out(2)' }, 0);
  /* 2. abre para a largura toda, centrada */
  tl.to('#{{ID}}-pilula', { x: 0, clipPath: 'inset(0px 0px 0px 0px round 60px)', duration: .55, ease: 'power3.out' }, .38);
  tl.fromTo('#{{ID}}-textos', { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: .35, ease: 'power2.out' }, .62);
  tl.fromTo('#{{ID}}-botao', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .35, ease: 'back.out(2.2)' }, .78);
  /* 3. o cursor entra e vai até o botão */
  var CLIQUE = {{CLIQUE}};
  var alvoX = ESQ + LARG - 16 - 98, alvoY = TOPO + 60;
  tl.fromTo('#{{ID}}-cursor', { opacity: 0, x: ESQ + LARG + 10, y: Math.min(TOPO + 410, 1860) }, { opacity: 1, x: alvoX - 8, y: alvoY - 4, duration: .85, ease: 'power2.inOut' }, CLIQUE - .95);
  tl.to('#{{ID}}-cursor', { scale: .8, duration: .08, ease: 'power1.in' }, CLIQUE);
  tl.to('#{{ID}}-cursor', { scale: 1, duration: .14, ease: 'power1.out' }, CLIQUE + .08);
  tl.to('#{{ID}}-botao', { scale: .9, duration: .08, ease: 'power1.in' }, CLIQUE);
  /* 4. vira "Seguindo ✓" */
  tl.to('#{{ID}}-botao', { backgroundColor: '#333333', scale: 1, duration: .2, ease: 'power2.out' }, CLIQUE + .08);
  tl.to('#{{ID}}-botao .a', { opacity: 0, duration: .12 }, CLIQUE + .08);
  tl.to('#{{ID}}-botao .b', { opacity: 1, duration: .18 }, CLIQUE + .14);
  tl.to('#{{ID}}-cursor', { opacity: 0, x: '+=40', y: '+=60', duration: .4, ease: 'power1.in' }, CLIQUE + .45);
  window.__timelines = window.__timelines || {};
  window.__timelines['{{ID}}'] = tl;
</script>
</body>
</html>
